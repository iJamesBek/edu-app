# Netlify detects Next.js and applies its OpenNext adapter automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Demo site: keep it out of search engines. Remove for the real launch.
[context.production.environment]
  NEXT_PUBLIC_NOINDEX = "1"

[context.deploy-preview.environment]
  NEXT_PUBLIC_NOINDEX = "1"
